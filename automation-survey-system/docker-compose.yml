version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tass-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tass_dev}
      POSTGRES_USER: ${POSTGRES_USER:-tass_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tass_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tass_user} -d ${POSTGRES_DB:-tass_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tass-backend
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-tass_user}:${POSTGRES_PASSWORD:-tass_password}@postgres:5432/${POSTGRES_DB:-tass_dev}
      SECRET_KEY: ${SECRET_KEY}
      LDAP_SERVER: ${LDAP_SERVER:-ldap://ad1.leemock.local}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=leemock,DC=local}
      LDAP_BIND_USER_DN: ${LDAP_BIND_USER_DN}
      LDAP_PASSWORD: ${LDAP_PASSWORD}
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tass-frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tass-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tass_dev}
      POSTGRES_USER: ${POSTGRES_USER:-tass_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tass_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tass_user} -d ${POSTGRES_DB:-tass_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
